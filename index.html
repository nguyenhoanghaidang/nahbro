    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const typewriter = document.getElementById("typewriter");

        if (!typewriter) {
          return;
        }

        const text = typewriter.getAttribute("data-text");
        const speed = 40;
        let index = 0;

        typewriter.textContent = "";
        typewriter.classList.add("typing");

        function typeText() {
          if (index < text.length) {
            typewriter.textContent += text.charAt(index);
            index++;

            setTimeout(typeText, speed);
          } else {
            setTimeout(function () {
              typewriter.classList.remove("typing");
            }, 700);
          }
        }

        typeText();
        const music = document.getElementById("backgroundMusic");
        const musicToggle = document.getElementById("musicToggle");
        const musicIcon = document.getElementById("musicIcon");
        const avatarShell = document.getElementById("avatarShell");

        if (music && musicToggle && musicIcon && avatarShell) {
          musicToggle.addEventListener("click", async function () {
            if (music.paused) {
              try {
                await music.play();

                avatarShell.classList.add("is-playing");
                musicIcon.textContent = "Ⅱ";
                musicToggle.setAttribute("aria-label", "Tạm dừng nhạc");
              } catch (error) {
                console.error("Không thể phát nhạc:", error);
              }
            } else {
              music.pause();

              avatarShell.classList.remove("is-playing");
              musicIcon.textContent = "▶";
              musicToggle.setAttribute("aria-label", "Phát nhạc");
            }
          });
        }
      });
    </script>
    <script>
      // Chặn chuột phải
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault(),
      );

      // Chặn các phím tắt F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+U (Xem nguồn trang)
      document.onkeydown = function (e) {
        if (e.keyCode == 123) {
          // F12
          return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67)) {
          // Ctrl+Shift+I / C
          return false;
        }
        if (e.ctrlKey && e.keyCode == 85) {
          // Ctrl+U
          return false;
        }
      };
    </script>
